    <div class="content">
        <div id="errorBox" class="error-box"></div>

        <div class="info-box" style="margin-bottom: 20px;">
            <h3>🔑 Claude APIキー設定</h3>
            <p style="margin: 10px 0; font-size: 0.9em;">APIキーは <a href="https://console.anthropic.com/" target="_blank">Anthropic Console</a> から取得できます</p>
            <input type="password" id="apiKeyInput" placeholder="sk-ant-..." style="width: 100%; padding: 10px; border: 1px solid #2196f3; border-radius: 5px; font-size: 1em; margin-bottom: 10px;">
            <button id="saveApiKeyBtn" style="padding: 10px 20px; background: #2196f3; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em;">保存</button>
            <div id="apiKeyStatus" style="margin-top: 10px; font-size: 0.9em;"></div>
        </div>

        <div class="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div class="status-overlay">
                <div class="status-text" id="status">待機中</div>
                <div class="last-detection" id="lastDetection"></div>
            </div>
        </div>

        <canvas id="canvas"></canvas>

        <div class="controls">
            <div class="volume-control">
                <label>🔊 アラート音量: <span id="volumeValue">70</span>%</label>
                <input type="range" id="volumeSlider" min="0" max="100" value="70">
            </div>

            <button id="startBtn" class="btn-start">📹 監視を開始</button>
        </div>

        <div class="info-box">
            <h3>📱 使い方</h3>
            <ol>
                <li>カメラの許可を出してや</li>
                <li>「監視を開始」ボタンを押す</li>
                <li>5秒ごとにClaudeが犬の様子をチェック!</li>
                <li>犬が動いたらアラート音が鳴るで🔔</li>
            </ol>
        </div>
    </div>
</div>

<script>
    let isMonitoring = false;
    let intervalId = null;
    let audioContext = null;
    let volume = 0.7;
    let apiKey = '';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeValue = document.getElementById('volumeValue');
    const statusText = document.getElementById('status');
    const lastDetectionText = document.getElementById('lastDetection');
    const errorBox = document.getElementById('errorBox');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');
    const apiKeyStatus = document.getElementById('apiKeyStatus');

    // APIキーの保存と読み込み
    function saveApiKey() {
        const key = apiKeyInput.value.trim();
        if (!key) {
            apiKeyStatus.textContent = '❌ APIキーを入力してください';
            apiKeyStatus.style.color = '#c62828';
            return;
        }
        if (!key.startsWith('sk-ant-')) {
            apiKeyStatus.textContent = '❌ APIキーの形式が正しくありません';
            apiKeyStatus.style.color = '#c62828';
            return;
        }
        localStorage.setItem('claude_api_key', key);
        apiKey = key;
        apiKeyStatus.textContent = '✅ APIキーを保存しました';
        apiKeyStatus.style.color = '#2e7d32';
    }

    function loadApiKey() {
        const savedKey = localStorage.getItem('claude_api_key');
        if (savedKey) {
            apiKey = savedKey;
            apiKeyInput.value = savedKey;
            apiKeyStatus.textContent = '✅ APIキーが設定されています';
            apiKeyStatus.style.color = '#2e7d32';
        }
    }

    // カメラの初期化
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'environment',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            });
            video.srcObject = stream;
            hideError();
        } catch (error) {
            console.error('カメラエラー:', error);
            showError('カメラにアクセスできへんかった😢 ブラウザの設定でカメラを許可してや!');
        }
    }

    // エラー表示
    function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.add('show');
    }

    function hideError() {
        errorBox.classList.remove('show');
    }

    // アラート音を鳴らす
    function playAlert() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        const now = audioContext.currentTime;
        
        // 1回目のビープ音
        const osc1 = audioContext.createOscillator();
        const gain1 = audioContext.createGain();
        osc1.connect(gain1);
        gain1.connect(audioContext.destination);
        osc1.frequency.value = 800;
        osc1.type = 'sine';
        gain1.gain.value = volume;
        osc1.start(now);
        osc1.stop(now + 0.3);
        
        // 2回目のビープ音
        const osc2 = audioContext.createOscillator();
        const gain2 = audioContext.createGain();
        osc2.connect(gain2);
        gain2.connect(audioContext.destination);
        osc2.frequency.value = 600;
        osc2.type = 'sine';
        gain2.gain.value = volume;
        osc2.start(now + 0.35);
        osc2.stop(now + 0.65);
    }

    // Claudeに画像を送信して判定
    async function checkDogMovement() {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        
        const imageData = canvas.toDataURL('image/jpeg', 0.8);
        const base64Image = imageData.split(',')[1];

        try {
            if (!apiKey) {
                showError('APIキーが設定されていません😢 まずAPIキーを保存してください!');
                return;
            }

            const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': apiKey,
                    'anthropic-version': '2023-06-01'
                },
                body: JSON.stringify({
                    model: 'claude-sonnet-4-20250514',
                    max_tokens: 1024,
                    messages: [{
                        role: 'user',
                        content: [
                            {
                                type: 'image',
                                source: {
                                    type: 'base64',
                                    media_type: 'image/jpeg',
                                    data: base64Image
                                }
                            },
                            {
                                type: 'text',
                                text: 'この画像に犬が映っていますか?そして犬が動いている(活発な状態)か、寝ている/じっとしているか判定してください。「動いている」または「寝ている」のどちらかで簡潔に答えてください。'
                            }
                        ]
                    }]
                })
            });

            const data = await response.json();
            const result = data.content?.[0]?.text || '';
            
            if (result.includes('動いている')) {
                statusText.textContent = '🏃 犬が動いてる!';
                const now = new Date();
                lastDetectionText.textContent = `最後の検知: ${now.toLocaleTimeString('ja-JP')}`;
                playAlert();
            } else {
                statusText.textContent = '😴 犬は寝てるで';
            }
            
            hideError();
        } catch (error) {
            console.error('API エラー:', error);
            showError('Claudeとの通信でエラーが出たで😢');
        }
    }

    // 監視の開始/停止
    function toggleMonitoring() {
        if (isMonitoring) {
            clearInterval(intervalId);
            isMonitoring = false;
            startBtn.textContent = '📹 監視を開始';
            startBtn.className = 'btn-start';
            statusText.textContent = '待機中';
        } else {
            if (!apiKey) {
                showError('APIキーが設定されていません😢 まずAPIキーを保存してください!');
                return;
            }
            isMonitoring = true;
            startBtn.textContent = '⏹️ 監視を停止';
            startBtn.className = 'btn-stop';
            checkDogMovement(); // 即座に1回チェック
            intervalId = setInterval(checkDogMovement, 5000);
        }
    }

    // 音量調整
    volumeSlider.addEventListener('input', (e) => {
        volume = e.target.value / 100;
        volumeValue.textContent = e.target.value;
    });

    // APIキー保存ボタン
    saveApiKeyBtn.addEventListener('click', saveApiKey);

    // Enterキーでも保存できるように
    apiKeyInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            saveApiKey();
        }
    });

    // ボタンクリック
    startBtn.addEventListener('click', toggleMonitoring);

    // 初期化
    loadApiKey();
    initCamera();
</script>
